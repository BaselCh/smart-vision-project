<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMARTVISION - Login de Acesso</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        smart: {
                            blue: '#0066ff',
                            purple: '#7c3aed',
                            pink: '#ec4899',
                            cyan: '#06b6d4'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
        }

        /* ---------------------------------------------------- */
        /* AUTOMATIC BACKGROUND SLIDESHOW (5 IMAGES)            */
        /* ---------------------------------------------------- */
        .bg-slider-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-slide {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center right;
            opacity: 0;
            transform: scale(1);
            transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1), transform 7s ease-out;
            will-change: opacity, transform;
        }

        .bg-slide.active {
            opacity: 1;
            transform: scale(1.04);
        }

        .bg-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 25% 50%, rgba(255, 255, 255, 0.2) 0%, rgba(15, 23, 42, 0.15) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* ---------------------------------------------------- */
        /* ENLARGED WHITE GLASS CARD (+20% LARGER)              */
        /* ---------------------------------------------------- */
        .login-glass-card {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 2rem;
            box-shadow: 0 35px 70px -15px rgba(0, 0, 0, 0.16), 0 12px 30px -6px rgba(0, 0, 0, 0.09);
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            transition: all 0.3s ease;
        }

        /* ---------------------------------------------------- */
        /* CUSTOM BUTTON (NO SHADOWS AT ALL IN NORMAL OR HOVER)*/
        /* ---------------------------------------------------- */
        .custom-enviar-btn {
            background-image: url('assets/button/button%20bg.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            color: #ffffff;
            border-radius: 0.95rem;
            font-weight: 800;
            font-size: 1.05rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: none !important; /* NO SHADOW */
            border: none;
            cursor: pointer;
        }

        .custom-enviar-btn:hover {
            background-image: url('assets/button/button%20bg%20hover.png');
            transform: translateY(-1px);
            box-shadow: none !important; /* NO SHADOW ON HOVER */
        }

        .custom-input {
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 0.95rem;
            transition: all 0.2s ease;
        }
        .custom-input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
            outline: none;
        }
    </style>
</head>
<body class="relative min-h-screen flex items-center justify-center sm:justify-start p-6 sm:p-12 lg:pl-48 xl:pl-64 lg:pr-12">

    <!-- 1. AUTOMATIC BACKGROUND SLIDESHOW -->
    <div class="bg-slider-container">
        <div class="bg-slide active" style="background-image: url('assets/bg/bg_1.png');"></div>
        <div class="bg-slide" style="background-image: url('assets/bg/bg_2.png');"></div>
        <div class="bg-slide" style="background-image: url('assets/bg/bg_3.png');"></div>
        <div class="bg-slide" style="background-image: url('assets/bg/bg_4.png');"></div>
        <div class="bg-slide" style="background-image: url('assets/bg/bg_5.png');"></div>
        <div class="bg-overlay"></div>
    </div>

    <!-- 2. BALANCED LEFT-ALIGNED LOGIN GLASS CONTAINER (+20% LARGER CARD) -->
    <main class="relative z-10 w-full max-w-xl xl:max-w-2xl">
        <div class="login-glass-card p-9 sm:p-12 text-center">
            
            <!-- VIDEO REVEAL LOGO (ENLARGED) -->
            <div class="flex flex-col items-center justify-center mb-5 overflow-hidden min-h-[140px]">
                <video id="logoVideo" autoplay muted playsinline class="h-36 sm:h-44 lg:h-48 w-auto object-contain mx-auto">
                    <source src="assets/logo.mp4" type="video/mp4">
                    <img src="assets/smartvision_logo_horizontal.png" alt="SMARTVISION" class="h-28 w-auto object-contain">
                </video>
            </div>

            <!-- SUBTITLE TEXT -->
            <p class="text-sm sm:text-base font-semibold text-slate-600 mb-7 px-2 leading-relaxed">
                Olá, Faça o login de acesso à plataforma Add Intelligence.
            </p>

            <!-- ERROR ALERT -->
            <div id="errorAlert" class="hidden mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs sm:text-sm font-bold flex items-center justify-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 text-rose-600"></i>
                <span id="errorMessage">Usuário ou senha inválidos.</span>
            </div>

            <!-- FORM FIELDS (+20% ENLARGED INPUTS) -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5 text-left max-w-md mx-auto">
                
                <!-- Login (Username) -->
                <div>
                    <label for="usernameInput" class="block text-xs font-extrabold text-slate-700 mb-1.5">Login</label>
                    <input type="text" id="usernameInput" required placeholder="" class="w-full px-4 py-3 sm:py-3.5 custom-input text-base font-bold text-slate-900">
                </div>

                <!-- Senha (Password) -->
                <div>
                    <label for="passwordInput" class="block text-xs font-extrabold text-slate-600 mb-1.5">Senha</label>
                    <input type="password" id="passwordInput" required placeholder="" class="w-full px-4 py-3 sm:py-3.5 custom-input text-base font-bold text-slate-900">
                </div>

                <!-- BUTTON ENVIAR (NO SHADOWS) -->
                <div class="pt-3">
                    <button type="submit" class="w-full custom-enviar-btn py-3.5 sm:py-4 flex items-center justify-center gap-2">
                        <span>Enviar</span>
                    </button>
                </div>
            </form>

            <!-- FOOTER BADGES & COPYRIGHT -->
            <div class="mt-10 pt-6 border-t border-slate-200/80 flex flex-col items-center gap-3.5">
                <div class="flex items-center justify-center gap-7">
                    <!-- SITE DEFENDER SELO LOGO -->
                    <img src="assets/site_defender_selo.png" alt="Site Defender" class="h-7 sm:h-8 w-auto object-contain">
                    
                    <!-- NEW HUMANS GROUP 6 LOGO -->
                    <img src="assets/new_humans_group6.png" alt="new humans" class="h-7 sm:h-8 w-auto object-contain">
                </div>
                
                <!-- COPYRIGHT TEXT -->
                <p class="text-xs font-bold text-slate-500">
                    Copyright © 2026 Smart vision - Todos os direitos reservados.
                </p>
            </div>

        </div>
    </main>

    <!-- JAVASCRIPT -->
    <script>
        lucide.createIcons();

        // Video freeze on last frame
        const logoVid = document.getElementById('logoVideo');
        if (logoVid) {
            logoVid.addEventListener('ended', function() {
                logoVid.pause();
            });
        }

        // Automatic Background Slideshow
        const slides = document.querySelectorAll('.bg-slide');
        let currentSlide = 0;
        const slideIntervalTime = 5500;

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        setInterval(nextSlide, slideIntervalTime);

        // Login Handler
        function handleLogin(event) {
            event.preventDefault();
            
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();

            const alertBox = document.getElementById('errorAlert');

            if (user.toLowerCase() === 'basel' && pass === 'test') {
                alertBox.classList.add('hidden');
                sessionStorage.setItem('smartvision_authenticated', 'true');
                sessionStorage.setItem('smartvision_user', user);
                window.location.href = 'dashboard.html';
            } else {
                alertBox.classList.remove('hidden');
                document.getElementById('errorMessage').innerText = 'Credenciais inválidas. Verifique Login e Senha.';
            }
        }
    </script>
</body>
</html>
