<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMARTVISION - Login de Acesso</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        smart: {
                            blue: '#0066ff',
                            purple: '#7c3aed',
                            pink: '#ec4899',
                            cyan: '#06b6d4'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #e2e8f0;
            color: #0f172a;
        }

        /* Gradient Button Matching SMARTVISION Logo */
        .btn-gradient {
            background: linear-gradient(90deg, #ec4899 0%, #7c3aed 50%, #0066ff 100%);
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.4);
        }

        .login-card {
            background: #ffffff;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
            border-radius: 1.5rem;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- MAIN CENTERED LOGIN CONTAINER -->
    <main class="w-full max-w-xl">
        <div class="login-card p-8 sm:p-12 border border-slate-200 text-center">
            
            <!-- SMARTVISION LOGO & MARK -->
            <div class="flex flex-col items-center justify-center mb-6">
                <img src="assets/smartvision_logo_horizontal.png" alt="SMARTVISION" class="h-16 w-auto object-contain mb-2">
            </div>

            <!-- SUBTITLE -->
            <p class="text-xs sm:text-sm font-bold text-slate-600 mb-8">
                Olá, Faça o login de acesso à plataforma Add Intelligence.
            </p>

            <!-- ERROR ALERT -->
            <div id="errorAlert" class="hidden mb-6 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-black flex items-center justify-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 text-rose-600"></i>
                <span id="errorMessage">Usuário, senha ou empresa inválidos.</span>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5 text-left max-w-md mx-auto">
                
                <!-- 1. Login (Username) -->
                <div>
                    <label for="usernameInput" class="block text-[11px] font-black text-slate-700 uppercase tracking-wider mb-1.5">Login</label>
                    <input type="text" id="usernameInput" required placeholder="Digite seu usuário (ex: basel)" class="w-full px-4 py-3 rounded-xl bg-white border-2 border-slate-200 text-sm font-bold text-slate-900 focus:outline-none focus:border-blue-600 transition-colors">
                </div>

                <!-- 2. Senha (Password) -->
                <div>
                    <label for="passwordInput" class="block text-[11px] font-black text-slate-700 uppercase tracking-wider mb-1.5">Senha</label>
                    <input type="password" id="passwordInput" required placeholder="Digite sua senha" class="w-full px-4 py-3 rounded-xl bg-white border-2 border-slate-200 text-sm font-bold text-slate-900 focus:outline-none focus:border-blue-600 transition-colors">
                </div>

                <!-- 3. Empresa (Company) -->
                <div>
                    <label for="companyInput" class="block text-[11px] font-black text-slate-700 uppercase tracking-wider mb-1.5">Empresa</label>
                    <input type="text" id="companyInput" required placeholder="Digite sua empresa" class="w-full px-4 py-3 rounded-xl bg-white border-2 border-slate-200 text-sm font-bold text-slate-900 focus:outline-none focus:border-blue-600 transition-colors">
                </div>

                <!-- SUBMIT BUTTON (Enviar) -->
                <div class="pt-3">
                    <button type="submit" class="w-full btn-gradient py-3.5 rounded-xl text-white font-black text-sm tracking-wider uppercase shadow-lg flex items-center justify-center gap-2">
                        <span>Enviar</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </form>

            <!-- FOOTER BADGES & COPYRIGHT -->
            <div class="mt-12 pt-6 border-t border-slate-200 flex flex-col items-center gap-4">
                <div class="flex items-center justify-center gap-6 text-xs font-black text-slate-700">
                    <span class="flex items-center gap-1.5">
                        <i data-lucide="shield-check" class="w-4 h-4 text-emerald-600"></i> Site Defender
                    </span>
                    <span>•</span>
                    <span class="text-purple-700">new humans</span>
                    <span>•</span>
                    <span class="text-blue-700">Addsuite</span>
                </div>
                <p class="text-[10px] font-bold text-slate-400">
                    Copyright © 2026 Add Intelligence - Todos os direitos reservados.
                </p>
            </div>

        </div>
    </main>

    <!-- LOGIN SCRIPT -->
    <script>
        lucide.createIcons();

        function handleLogin(event) {
            event.preventDefault();
            
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            const comp = document.getElementById('companyInput').value.trim();

            const alertBox = document.getElementById('errorAlert');

            // Credential Check: Username = basel, Password = test, Company = test
            if (user === 'basel' && pass === 'test' && comp === 'test') {
                alertBox.classList.add('hidden');
                // Store auth token in sessionStorage
                sessionStorage.setItem('smartvision_authenticated', 'true');
                sessionStorage.setItem('smartvision_user', user);
                sessionStorage.setItem('smartvision_company', comp);
                
                // Redirect immediately to dashboard
                window.location.href = 'dashboard.html';
            } else {
                alertBox.classList.remove('hidden');
                document.getElementById('errorMessage').innerText = 'Credenciais inválidas. Verifique Login, Senha e Empresa.';
            }
        }
    </script>
</body>
</html>
